services:
  db:
    image: postgres:14.3
    restart: always
    ports:
      # Puerto alto en el host para evitar choques con 5432/5433 u otros Postgres locales
      - "30432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    container_name: backend-nestjs-postgres
    volumes:
      - ./postgres:/var/lib/postgresql/data
