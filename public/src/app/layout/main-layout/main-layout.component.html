<main class="main-content">
	<router-outlet></router-outlet>
</main>
<footer class="footer">
	<div class="dock-window">
		<p-dock [model]="items" [position]="'bottom'">
			<ng-template #item let-item>
				<img [pTooltip]="item.label" tooltipPosition="top" [src]="item.icon" [alt]="item.label" width="30px" height="30px" />
			</ng-template>
		</p-dock>
	</div>
</footer>
